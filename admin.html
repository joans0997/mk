<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administrar productos · MerkoMAX</title><link rel="stylesheet" href="assets/css/admin.css"><script src="assets/js/config.js" defer></script><script src="assets/js/catalog.js" defer></script><script src="assets/js/admin.js" defer></script></head>
<body><header><a href="index.html">← Ir a la tienda</a><strong>MerkoMAX <span>· Catálogo</span></strong><button id="logout" hidden>Cerrar sesión</button></header><main>
<h1>Tus productos, en un solo lugar.</h1><p>Actualiza precios y fotos, y elige qué productos se muestran en la tienda.</p>
<p id="status" role="status" aria-live="polite"></p>
<form id="login"><h2>Acceso administrador</h2><label>Correo<input id="email" type="email" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form>
<section id="workspace" hidden><div class="admin-toolbar"><h2 id="total">Productos</h2><button id="newProduct">+ Nuevo producto</button></div><div class="admin-layout">
<section><label>Buscar en el catálogo<input id="adminSearch" type="search" placeholder="Nombre o categoría"></label><div id="list"></div></section>
<form id="productForm"><h2 id="formTitle">Nuevo producto</h2><input id="productId" type="hidden"><label>Nombre<input id="name" maxlength="180" required></label><label>Categoría<select id="category"></select></label><label>Precio (COP)<input id="price" type="number" min="1" max="1000000000" step="0.01" required></label><label>Foto del producto<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="hint">JPG, PNG o WebP, máximo 5 MB. Puedes dejarla pendiente.</p><img id="preview" src="assets/placeholder.svg" alt="Vista previa del producto"><label class="check"><input id="active" type="checkbox" checked>Visible en la tienda</label><label class="check"><input id="offer" type="checkbox">En oferta</label><label class="check"><input id="bestseller" type="checkbox">Destacado</label><button id="saveProduct">Guardar producto</button></form>
</div></section></main></body></html>
