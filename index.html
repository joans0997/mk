<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>
        Supermercado MerkoMAX NIMAR - Cimitarra
    </title>

    <link
        rel="icon"
        type="image/png"
        href="logo.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        brand: {
                            blue: '#102A43',
                            blueDark: '#071A2B',
                            wine: '#7F1D3A',
                            wineDark: '#5A1028',
                            red: '#7F1D3A',
                            dark: '#102A43'
                        }

                    }

                }

            }

        }

    </script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <style>

        /* =========================================================
           BRAND
        ========================================================= */

        :root {

            --brand-blue:
                #102A43;

            --brand-blue-dark:
                #071A2B;

            --brand-blue-light:
                #EAF2F8;

            --brand-wine:
                #7F1D3A;

            --brand-wine-dark:
                #5A1028;

            --brand-wine-light:
                #F8EAF0;

            --brand-white:
                #FFFFFF;

            --brand-bg:
                #F4F6F8;

        }


        /* =========================================================
           BASE
        ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f4f6f8;
            color: #1e293b;
            overflow-x: hidden;
        }

        img {
            display: block;
            max-width: 100%;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }


        /* =========================================================
           SEARCH DROPDOWN
        ========================================================= */

        .mobile-search {
            position: relative;
            z-index: 200;
        }

        .mobile-search > div {
            position: relative;
            z-index: 201;
        }

        #searchResults {

            position: absolute;

            top:
                calc(100% + 7px);

            left: 0;
            right: 0;

            z-index: 9999;

            background:
                white;

            border:
                1px solid #d9e2ec;

            border-radius:
                16px;

            box-shadow:
                0 18px 40px
                rgba(7,26,43,.18);

            overflow-y:
                auto;

            max-height:
                320px;

            display:
                none;
        }

        #searchResults.show {
            display: block !important;
        }

        .search-result-item {

            width: 100%;

            display: flex;

            align-items: center;

            gap: 10px;

            padding:
                9px 11px;

            min-height:
                58px;

            background:
                white;

            border: 0;

            text-align:
                left;
        }

        .search-result-item:hover {
            background:
                #f6f8fa;
        }

        .search-result-image {

            width:
                42px;

            height:
                42px;

            flex:
                0 0 42px;

            object-fit:
                contain;

            border-radius:
                9px;

            background:
                #f8fafc;

            padding:
                4px;
        }

        .search-result-name {

            flex:
                1;

            min-width:
                0;

            font-size:
                11px;

            font-weight:
                700;

            color:
                #0f172a;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;
        }

        .search-result-price {

            font-size:
                10px;

            font-weight:
                800;

            color:
                var(--brand-wine);

            white-space:
                nowrap;
        }


        /* =========================================================
           DESKTOP
        ========================================================= */

        #mobileBottomNav {
            display: none;
        }


        /* =========================================================
           TABLET
        ========================================================= */

        @media (min-width: 641px) and (max-width: 1024px) {

            #productsGrid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr)) !important;
            }

            .product-image {
                height:
                    155px !important;
            }

        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 640px) {

            body {

                padding-bottom:
                    calc(
                        76px +
                        env(safe-area-inset-bottom)
                    );
            }


            /* =====================================================
               HEADER AZUL
            ===================================================== */

            header {

                background:
                    linear-gradient(
                        135deg,
                        var(--brand-blue-dark),
                        var(--brand-blue)
                    ) !important;

                backdrop-filter:
                    blur(14px);

                -webkit-backdrop-filter:
                    blur(14px);

                box-shadow:
                    0 4px 18px
                    rgba(7,26,43,.22) !important;

                border-bottom:
                    1px solid
                    rgba(255,255,255,.08) !important;
            }

            .mobile-header {

                width:
                    100%;

                height:
                    auto !important;

                min-height:
                    60px;

                padding:
                    9px 12px 10px !important;

                display:
                    grid !important;

                grid-template-columns:
                    minmax(0,1fr)
                    auto;

                grid-template-rows:
                    40px
                    42px;

                gap:
                    8px 10px !important;
            }

            .mobile-logo {

                min-width:
                    0;

                display:
                    flex;

                align-items:
                    center;
            }

            .mobile-logo img {

                width:
                    auto;

                max-width:
                    140px;

                height:
                    33px !important;

                object-fit:
                    contain;
            }


            /* =====================================================
               CART BUTTON HEADER
            ===================================================== */

            .mobile-cart {

                grid-column:
                    2;

                grid-row:
                    1;

                width:
                    44px;

                height:
                    40px;

                padding:
                    0 !important;

                display:
                    flex;

                align-items:
                    center;

                justify-content:
                    center;

                border-radius:
                    12px !important;

                background:
                    var(--brand-wine) !important;

                color:
                    white !important;

                box-shadow:
                    0 5px 12px
                    rgba(90,16,40,.28);

                border:
                    1px solid
                    rgba(255,255,255,.12);
            }

            .mobile-cart:hover {

                background:
                    var(--brand-wine-dark) !important;
            }

            #cartTrigger > span:first-child {
                font-size:
                    18px;
            }

            #cartCounter {

                position:
                    absolute;

                top:
                    -3px;

                right:
                    -3px;

                background:
                    #ffffff !important;

                color:
                    var(--brand-wine) !important;

                border:
                    2px solid
                    var(--brand-blue);
            }


            /* =====================================================
               SEARCH
            ===================================================== */

            .mobile-search {

                grid-column:
                    1 / -1;

                grid-row:
                    2;

                width:
                    100% !important;

                max-width:
                    none !important;

                margin:
                    0 !important;
            }

            .mobile-search > div {
                width:
                    100%;
            }

            .mobile-search input {

                width:
                    100%;

                height:
                    42px;

                padding:
                    0 13px 0 40px !important;

                background:
                    rgba(255,255,255,.97) !important;

                border:
                    1px solid
                    rgba(255,255,255,.35) !important;

                border-radius:
                    12px !important;

                font-size:
                    13px !important;

                color:
                    #102A43 !important;

                box-shadow:
                    0 4px 12px
                    rgba(0,0,0,.08);
            }

            .mobile-search input::placeholder {
                color:
                    #7b8794;
            }

            .mobile-search input:focus {

                background:
                    #fff !important;

                border-color:
                    var(--brand-wine) !important;

                box-shadow:
                    0 0 0 3px
                    rgba(127,29,58,.20);
            }

            #searchResults {

                position:
                    absolute !important;

                top:
                    calc(100% + 7px) !important;

                left:
                    0 !important;

                right:
                    0 !important;

                width:
                    100% !important;

                max-height:
                    300px;

                border-radius:
                    14px !important;

                z-index:
                    99999 !important;
            }


            /* =====================================================
               HERO AZUL + VINO
            ===================================================== */

            .mobile-hero {

                width:
                    100%;

                padding:
                    14px 12px !important;

                background:
                    linear-gradient(
                        135deg,
                        var(--brand-blue-dark) 0%,
                        var(--brand-blue) 55%,
                        var(--brand-wine-dark) 100%
                    ) !important;
            }

            .mobile-hero-grid {

                display:
                    grid !important;

                grid-template-columns:
                    1fr !important;

                gap:
                    10px !important;
            }

            .mobile-hero h1 {

                font-size:
                    19px !important;

                line-height:
                    1.2 !important;

                max-width:
                    340px;
            }

            .mobile-hero p {

                font-size:
                    11px !important;

                line-height:
                    1.4 !important;

                color:
                    #d9e2ec !important;
            }

            .mobile-hero-image {

                width:
                    100%;

                height:
                    95px;

                border-radius:
                    12px !important;

                overflow:
                    hidden;

                border:
                    1px solid
                    rgba(255,255,255,.15) !important;
            }

            .mobile-hero-image img {

                width:
                    100%;

                height:
                    100% !important;

                object-fit:
                    cover;
            }


            /* =====================================================
               CATEGORIES
            ===================================================== */

            section.py-4 {

                width:
                    100%;

                padding:
                    10px 0 8px !important;

                background:
                    #ffffff;

                border-bottom:
                    1px solid
                    #e6ebef;
            }

            .mobile-categories {

                display:
                    flex;

                gap:
                    12px !important;

                padding:
                    0 12px 3px !important;

                overflow-x:
                    auto;
            }

            .mobile-category-button {

                flex:
                    0 0 57px;

                width:
                    57px;

                min-width:
                    57px;

                display:
                    flex;

                flex-direction:
                    column;

                align-items:
                    center;

                gap:
                    4px;

                border:
                    0;

                background:
                    transparent;
            }

            .mobile-category-icon {

                width:
                    45px !important;

                height:
                    45px !important;

                flex:
                    0 0 45px;

                font-size:
                    14px !important;

                box-shadow:
                    0 4px 10px
                    rgba(15,23,42,.08) !important;
            }

            .mobile-category-button span:last-child {

                width:
                    100%;

                font-size:
                    8px !important;

                text-align:
                    center;

                white-space:
                    nowrap;

                overflow:
                    hidden;

                text-overflow:
                    ellipsis;

                color:
                    #34495E !important;
            }


            /* =====================================================
               MAIN
            ===================================================== */

            .mobile-main {

                width:
                    100%;

                padding:
                    12px 9px 20px !important;
            }

            #sectionTitle {

                font-size:
                    15px !important;

                color:
                    var(--brand-blue) !important;
            }

            #sectionSubtitle {

                font-size:
                    9px !important;

                color:
                    #718096 !important;
            }


            /* =====================================================
               PRODUCT GRID
            ===================================================== */

            #productsGrid {

                width:
                    100%;

                display:
                    grid !important;

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0,1fr)
                    ) !important;

                gap:
                    8px !important;

                align-items:
                    stretch;
            }


            /* =====================================================
               PRODUCT CARD
            ===================================================== */

            .product-card {

                width:
                    100% !important;

                min-width:
                    0 !important;

                height:
                    auto !important;

                min-height:
                    250px;

                padding:
                    8px !important;

                display:
                    flex !important;

                flex-direction:
                    column !important;

                justify-content:
                    space-between !important;

                border-radius:
                    13px !important;

                border:
                    1px solid #e1e7ec !important;

                background:
                    #fff;

                overflow:
                    hidden !important;

                box-shadow:
                    0 3px 10px
                    rgba(16,42,67,.07) !important;
            }


            /* =====================================================
               PRODUCT IMAGE
            ===================================================== */

            .product-image {

                width:
                    100% !important;

                height:
                    100px !important;

                flex:
                    0 0 100px !important;

                margin:
                    0 0 7px 0 !important;

                border-radius:
                    9px !important;

                background:
                    #f5f8fa !important;

                overflow:
                    hidden !important;

                display:
                    flex !important;

                align-items:
                    center !important;

                justify-content:
                    center !important;
            }

            .product-image img {

                width:
                    100% !important;

                height:
                    100% !important;

                max-width:
                    100% !important;

                max-height:
                    100% !important;

                object-fit:
                    contain !important;

                object-position:
                    center !important;

                padding:
                    10px !important;
            }


            /* =====================================================
               PRODUCT INFO
            ===================================================== */

            .product-card > div:not(.product-image) {

                min-width:
                    0;
            }

            .product-name {

                display:
                    -webkit-box !important;

                -webkit-line-clamp:
                    2 !important;

                -webkit-box-orient:
                    vertical !important;

                width:
                    100% !important;

                height:
                    29px !important;

                margin:
                    0 !important;

                overflow:
                    hidden !important;

                font-size:
                    10px !important;

                line-height:
                    1.35 !important;

                color:
                    var(--brand-blue) !important;
            }


            /* =====================================================
               PRICE
            ===================================================== */

            .product-card > div:last-child {

                width:
                    100% !important;

                margin-top:
                    7px !important;

                padding-top:
                    7px !important;

                border-top:
                    1px solid #edf1f4 !important;

                display:
                    flex !important;

                flex-direction:
                    column !important;

                align-items:
                    stretch !important;

                gap:
                    6px !important;
            }

            .product-card > div:last-child > div:first-child {

                width:
                    100%;

                display:
                    flex;

                align-items:
                    baseline;

                gap:
                    5px;

                min-height:
                    17px;
            }

            .product-price {

                font-size:
                    12px !important;

                line-height:
                    1 !important;

                color:
                    var(--brand-wine) !important;
            }

            .product-old-price {

                font-size:
                    8px !important;
            }


            /* =====================================================
               ADD BUTTON VINO
            ===================================================== */

            .product-add {

                width:
                    100% !important;

                min-height:
                    31px !important;

                height:
                    31px !important;

                padding:
                    5px 3px !important;

                border-radius:
                    8px !important;

                font-size:
                    9px !important;

                line-height:
                    1 !important;

                background:
                    var(--brand-wine-light) !important;

                color:
                    var(--brand-wine) !important;

                border:
                    1px solid
                    rgba(127,29,58,.08);
            }

            .product-add:hover,
            .product-add:active {

                background:
                    var(--brand-wine) !important;

                color:
                    #ffffff !important;
            }


            /* =====================================================
               BADGES
            ===================================================== */

            .product-card .absolute.top-2\.5.right-2\.5 {

                top:
                    6px !important;

                right:
                    6px !important;

                width:
                    19px !important;

                height:
                    19px !important;

                font-size:
                    8px !important;

                background:
                    var(--brand-blue) !important;
            }

            .product-card .absolute.top-2\.5.left-2\.5 {

                top:
                    6px !important;

                left:
                    6px !important;

                padding:
                    3px 5px !important;

                font-size:
                    7px !important;
            }


            /* =====================================================
               WHATSAPP FLOATING
            ===================================================== */

            body > a[href*="wa.me"] {

                left:
                    auto !important;

                right:
                    13px !important;

                bottom:
                    calc(
                        77px +
                        env(safe-area-inset-bottom)
                    ) !important;

                width:
                    48px !important;

                height:
                    48px !important;

                padding:
                    0 !important;

                border-radius:
                    14px !important;

                display:
                    flex;

                align-items:
                    center;

                justify-content:
                    center;

                box-shadow:
                    0 7px 18px
                    rgba(15,23,42,.22) !important;
            }


            /* =====================================================
               BOTTOM NAV AZUL
            ===================================================== */

            #mobileBottomNav {

                position:
                    fixed;

                left:
                    0;

                right:
                    0;

                bottom:
                    0;

                width:
                    100%;

                height:
                    calc(
                        64px +
                        env(safe-area-inset-bottom)
                    );

                padding:
                    4px 14px
                    env(safe-area-inset-bottom);

                z-index:
                    9990;

                display:
                    flex !important;

                align-items:
                    flex-start;

                justify-content:
                    space-around;

                background:
                    linear-gradient(
                        135deg,
                        var(--brand-blue-dark),
                        var(--brand-blue)
                    );

                backdrop-filter:
                    blur(15px);

                -webkit-backdrop-filter:
                    blur(15px);

                border-top:
                    1px solid
                    rgba(255,255,255,.08);

                box-shadow:
                    0 -6px 22px
                    rgba(7,26,43,.25);
            }

            #mobileBottomNav button {

                position:
                    relative;

                width:
                    72px;

                height:
                    54px;

                padding:
                    3px 5px;

                border:
                    0;

                background:
                    transparent;

                color:
                    #b8c7d6;

                display:
                    flex;

                flex-direction:
                    column;

                align-items:
                    center;

                justify-content:
                    center;

                gap:
                    2px;

                font-size:
                    9px;

                font-weight:
                    700;
            }

            #mobileBottomNav button .nav-icon {

                font-size:
                    18px;

                line-height:
                    20px;
            }

            #mobileBottomNav button.active {

                color:
                    #ffffff;
            }

            #mobileBottomNav button.active .nav-icon {

                color:
                    #ffffff;

                filter:
                    drop-shadow(
                        0 2px 5px
                        rgba(127,29,58,.65)
                    );
            }

            #mobileBottomNav .nav-cart-wrap {

                position:
                    relative;
            }

            #mobileBottomNav .nav-cart-count {

                position:
                    absolute;

                top:
                    0;

                right:
                    7px;

                min-width:
                    15px;

                height:
                    15px;

                padding:
                    0 4px;

                border-radius:
                    99px;

                background:
                    var(--brand-wine);

                color:
                    white;

                font-size:
                    8px;

                align-items:
                    center;

                justify-content:
                    center;

                border:
                    1px solid
                    rgba(255,255,255,.4);
            }


            /* =====================================================
               CART OVERLAY
            ===================================================== */

            #cartOverlay {

                z-index:
                    9995 !important;

                background:
                    rgba(7,26,43,.70) !important;

                backdrop-filter:
                    blur(5px);
            }


            /* =====================================================
               CART PANEL
            ===================================================== */

            .mobile-cart-wrapper {

                width:
                    100% !important;

                max-width:
                    100% !important;

                padding-left:
                    28px !important;

                z-index:
                    9996 !important;

                pointer-events:
                    none;
            }

            .mobile-cart-panel {

                width:
                    100% !important;

                max-width:
                    420px !important;

                border-radius:
                    22px 0 0 22px;

                overflow:
                    hidden;

                box-shadow:
                    -12px 0 40px
                    rgba(7,26,43,.30);

                pointer-events:
                    auto;

                border-left:
                    1px solid
                    rgba(127,29,58,.10);
            }

            /* Header del carrito */

            #cartPanel .mobile-cart-panel > div:first-child {

                background:
                    linear-gradient(
                        135deg,
                        var(--brand-blue-dark),
                        var(--brand-blue)
                    ) !important;

                color:
                    #ffffff;

                border-bottom:
                    0 !important;

                padding:
                    15px !important;
            }

            #cartPanel .mobile-cart-panel > div:first-child h3 {

                color:
                    #ffffff !important;

                font-size:
                    13px !important;
            }

            #cartPanel #closeCart {

                color:
                    #d7e0e8 !important;

                font-size:
                    16px !important;
            }

            #cartPanel #closeCart:hover {

                color:
                    #ffffff !important;
            }

            #clearCartBtn {

                background:
                    rgba(255,255,255,.12) !important;

                color:
                    #ffffff !important;
            }


            /* Productos carrito */

            #cartContent {

                background:
                    #ffffff;

                padding:
                    12px !important;
            }

            #cartContent > div {

                background:
                    #f7f9fb !important;

                border:
                    1px solid #e4eaf0 !important;

                border-radius:
                    14px !important;
            }

            #cartContent img {

                background:
                    #ffffff !important;

                border:
                    1px solid #edf1f4;
            }

            #cartContent h5 {

                color:
                    var(--brand-blue) !important;
            }

            #cartContent p {

                color:
                    var(--brand-wine) !important;
            }

            #cartContent button {

                border-color:
                    #d7e0e8 !important;

                color:
                    var(--brand-blue) !important;
            }

            #cartContent button:hover {

                background:
                    var(--brand-wine) !important;

                color:
                    #ffffff !important;
            }


            /* Pie carrito */

            #cartPanel .mobile-cart-panel > div:last-child {

                background:
                    linear-gradient(
                        180deg,
                        #f8fafc,
                        #eef3f7
                    ) !important;

                border-top:
                    1px solid #dfe6ec !important;

                padding:
                    14px !important;
            }

            #cartPanel .mobile-cart-panel > div:last-child .flex {

                color:
                    var(--brand-blue);
            }

            #cartTotal {

                color:
                    var(--brand-wine) !important;

                font-size:
                    16px !important;
            }


            /* Botón continuar comprando */

            #continueShoppingBtn {

                width:
                    100%;

                min-height:
                    42px;

                border:
                    1px solid
                    var(--brand-blue);

                border-radius:
                    12px;

                background:
                    #ffffff;

                color:
                    var(--brand-blue);

                font-size:
                    11px;

                font-weight:
                    800;

                transition:
                    .2s ease;
            }

            #continueShoppingBtn:hover,
            #continueShoppingBtn:active {

                background:
                    var(--brand-blue);

                color:
                    #ffffff;

    <!-- =========================================================
         JAVASCRIPT
    ========================================================= -->

    <script>

        const SHEETDB_API =
            "https://sheetdb.io/api/v1/15hpacliqdaw2";

        const FALLBACK_IMAGE =
            "https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=400&q=80";


        let products = [];

        let cart = [];

        let currentCategory = "todos";

        let searchQuery = "";


        /* =========================================================
           INITIALIZATION
        ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadCartFromLocalStorage();

                setupEvents();

                fetchProductsFromSheet();

            }
        );


        /* =========================================================
           NORMALIZE TEXT
        ========================================================= */

        function normalizeText(text) {

            return String(text || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim();

        }


        /* =========================================================
           FETCH PRODUCTS
        ========================================================= */

        async function fetchProductsFromSheet() {

            try {

                const response =
                    await fetch(
                        SHEETDB_API
                    );


                if (!response.ok) {

                    throw new Error(
                        "Error conectando con SheetDB"
                    );

                }


                const data =
                    await response.json();


                products =
                    data.map(
                        function (item) {

                            return {

                                id:
                                    Number(item.id) ||
                                    Math.floor(
                                        Math.random() *
                                        999999
                                    ),

                                name:
                                    item.name ||
                                    "Producto",

                                category:
                                    item.category
                                        ? normalizeText(
                                            item.category
                                        )
                                        : "despensa",

                                price:
                                    parseFloat(
                                        String(
                                            item.price ||
                                            "0"
                                        )
                                            .replace(
                                                /\./g,
                                                ""
                                            )
                                            .replace(
                                                /[^0-9]/g,
                                                ""
                                            )
                                    ) || 0,

                                oldPrice:
                                    item.oldPrice
                                        ? parseFloat(
                                            String(
                                                item.oldPrice
                                            )
                                                .replace(
                                                    /\./g,
                                                    ""
                                                )
                                                .replace(
                                                    /[^0-9]/g,
                                                    ""
                                                )
                                        )
                                        : null,

                                isBestSeller:
                                    String(
                                        item.isBestSeller
                                    ).toUpperCase() ===
                                    "TRUE",

                                image:
                                    item.image ||
                                    FALLBACK_IMAGE

                            };

                        }
                    );


                renderProducts();


            } catch (error) {

                console.error(
                    "Error cargando productos:",
                    error
                );


                document
                    .getElementById(
                        "productsGrid"
                    )
                    .innerHTML = `

                        <p class="text-xs text-red-500 text-center col-span-2 py-8">

                            No se pudieron cargar los productos.

                        </p>

                    `;

            }

        }


        /* =========================================================
           RENDER PRODUCTS
        ========================================================= */

        function renderProducts() {

            const grid =
                document.getElementById(
                    "productsGrid"
                );


            if (!grid)
                return;


            const normalizedSearch =
                normalizeText(
                    searchQuery
                );


            const filtered =
                products.filter(
                    function (product) {

                        let matchesCategory =
                            true;


                        if (
                            currentCategory !==
                            "todos"
                        ) {

                            if (
                                currentCategory ===
                                "mas-vendidos"
                            ) {

                                matchesCategory =
                                    product.isBestSeller;

                            } else {

                                matchesCategory =
                                    product.category ===
                                    normalizeText(
                                        currentCategory
                                    );

                            }

                        }


                        const matchesSearch =
                            !normalizedSearch ||
                            normalizeText(
                                product.name
                            ).includes(
                                normalizedSearch
                            );


                        return (
                            matchesCategory &&
                            matchesSearch
                        );

                    }
                );


            if (
                filtered.length === 0
            ) {

                grid.innerHTML = `

                    <div
                        class="col-span-2 py-10 text-center">

                        <div class="text-3xl mb-2">
                            🔎
                        </div>

                        <p
                            class="text-xs font-semibold text-slate-500">

                            No encontramos productos.

                        </p>

                    </div>

                `;

                return;

            }


            grid.innerHTML =
                filtered
                    .map(
                        function (p) {

                            return `

                                <article
                                    class="product-card bg-white rounded-2xl p-3 border border-slate-100 shadow-sm flex flex-col justify-between relative group">


                                    ${
                                        p.category ===
                                        "combos"

                                            ? `

                                                <span
                                                    class="absolute top-2.5 left-2.5 z-10 bg-red-600 text-white text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase">

                                                    COMBO

                                                </span>

                                            `

                                            : ""
                                    }


                                    ${
                                        p.isBestSeller &&
                                        p.category !==
                                        "combos"

                                            ? `

                                                <span
                                                    class="absolute top-2.5 left-2.5 z-10 bg-amber-500 text-white text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase">

                                                    TOP

                );


            if (input) {

            closeSearchResults();

                );

                );


            if (title) {

                    category === "todos"

                                .charAt(0)

            if (subtitle) {

        /* =========================================================
           MOBILE SEARCH
        ========================================================= */

        function openMobileSearch() {

                "search"
            );

                document.getElementById(

                );

                        ) {

        /* =========================================================
           LIVE SEARCH
        ========================================================= */

        function updateSearchResults() {

            const input =
                document.getElementById(
                    "searchInput"
                );


            const resultsBox =
                document.getElementById(
                    "searchResults"
                );


            if (
                !input ||
                !resultsBox
            ) {

                return;

            }


            const query =
                normalizeText(
                    input.value
                );


            searchQuery =
                query;


            if (query) {

                currentCategory =
                    "todos";

            }


            renderProducts();


            if (!query) {

                closeSearchResults();

                return;

            }


            const results =
                products
                    .filter(
                        function (product) {

                            return normalizeText(
                                product.name
                            ).includes(
                                query
                            );

                        }
                    )
                    .slice(
                        0,
                        7
                    );


            if (
                results.length === 0
            ) {

                resultsBox.innerHTML = `

                    <div
                        class="p-4 text-center">

                        <div class="text-xl mb-1">
                            🔎
                        </div>

                        <p
                            class="text-xs font-semibold text-slate-600">

                            No encontramos "${input.value}"

                        </p>

                        <p
                            class="text-[10px] text-slate-400 mt-1">

                            Intenta con otro producto

                        </p>

                    </div>

                `;


                resultsBox.classList.add(
                    "show"
                );


                return;

            }


            resultsBox.innerHTML =
                results
                    .map(
                        function (product) {

                            return `

                                <button
                                    type="button"
                                    class="search-result-item"
                                    onclick="selectSearchProduct(${product.id})">


                                    <img
                                        src="${product.image}"
                                        alt="${product.name}"
                                        class="search-result-image"
                                        onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}'">


                                    <span
                                        class="search-result-name">

                                        ${product.name}

                                    </span>


                                    <span
                                        class="search-result-price">

                                        $${product.price.toLocaleString(
                                            "es-CO"
                                        )}

                                    </span>


                                </button>

                            `;

                        }
                    )
                    .join("");


            resultsBox.classList.add(
                "show"
            );

        }


        /* =========================================================
           SELECT SEARCH PRODUCT
        ========================================================= */

        function selectSearchProduct(id) {

            const product =
                products.find(
                    function (p) {

                        return p.id === id;

                    }
                );


            if (!product)
                return;


            const input =
                document.getElementById(
                    "searchInput"
                );


            if (input) {

                input.value =
                    product.name;

            }


            searchQuery =
                normalizeText(
                    product.name
                );


            currentCategory =
                "todos";


            closeSearchResults();


            setMobileNav(
                "search"
            );


            renderProducts();


            setTimeout(
                function () {

                    const cards =
                        document.querySelectorAll(
                            ".product-card"
                        );


                    const target =
                        Array
                            .from(cards)
                            .find(
                                function (card) {

                                    const name =
                                        card.querySelector(
                                            ".product-name"
                                        );


                                    return (
                                        name &&
                                        normalizeText(
                                            name.textContent
                                        ) ===
                                        normalizeText(
                                            product.name
                                        )
                                    );

                                }
                            );


                    if (target) {

                        target.scrollIntoView({

                            behavior:
                                "smooth",

                            block:
                                "center"

                        });

                    }

                },
                100
            );

        }


        /* =========================================================
           CLOSE SEARCH
        ========================================================= */

        function closeSearchResults() {

            const results =
                document.getElementById(
                    "searchResults"
                );


            if (!results)
                return;


            results.classList.remove(
                "show"
            );


            results.innerHTML =
                "";

        }


        /* =========================================================
           CART STORAGE
        ========================================================= */

        function loadCartFromLocalStorage() {

            const saved =
                localStorage.getItem(
                    "merkomax_cart"
                );


            if (saved) {

                try {

                    cart =
                        JSON.parse(
                            saved
                        );


                    if (
                        !Array.isArray(cart)
                    ) {

                        cart = [];

                    }

                } catch (error) {

                    cart = [];

                }

            }


            updateCartUI();

        }


        function saveCart() {

            localStorage.setItem(
                "merkomax_cart",
                JSON.stringify(
                    cart
                )
            );


            updateCartUI();

        }


        /* =========================================================
           ADD TO CART
        ========================================================= */

        function addToCart(id) {

            const product =
                products.find(
                    function (p) {

                        return p.id === id;

                    }
                );


            if (!product)
                return;


            const existing =
                cart.find(
                    function (item) {

                        return item.id === id;

                    }
                );


            if (existing) {

                existing.quantity++;

            } else {

                cart.push({

                    ...product,

                    quantity:
                        1

                });

            }


            saveCart();


            showToast(
                `¡Agregado: ${product.name}!`
            );

        }


        /* =========================================================
           UPDATE QUANTITY
        ========================================================= */

        function updateQty(
            id,
            delta
        ) {

            const item =
                cart.find(
                    function (x) {

                        return x.id === id;

                    }
                );


            if (!item)
                return;


            item.quantity +=
                delta;


            if (
                item.quantity <= 0
            ) {

                cart =
                    cart.filter(
                        function (x) {

                            return x.id !== id;

                        }
                    );

            }


            saveCart();

        }


        /* =========================================================
           REMOVE
        ========================================================= */

        function removeFromCart(id) {

            cart =
                cart.filter(
                    function (item) {

                        return item.id !== id;

                    }
                );


            saveCart();

        }


        /* =========================================================
           CLEAR
        ========================================================= */

        function clearCart() {

            if (
                !confirm(
                    "¿Vaciar carrito?"
                )
            ) {

                return;

            }


            cart = [];


            saveCart();

        }


        /* =========================================================
           UPDATE CART UI
        ========================================================= */

        function updateCartUI() {

            const count =
                cart.reduce(
                    function (
                        total,
                        item
                    ) {

                        return (
                            total +
                            Number(
                                item.quantity ||
                                0
                            )
                        );

                    },
                    0
                );


            const cartCounter =
                document.getElementById(
                    "cartCounter"
                );


            if (cartCounter) {

                cartCounter.textContent =
                    count;

            }


            const mobileCounter =
                document.getElementById(
                    "mobileNavCartCounter"
                );


            if (mobileCounter) {

                mobileCounter.textContent =
                    count;


                mobileCounter.style.display =
                    count > 0
                        ? "flex"
                        : "none";

            }


            const clearButton =
                document.getElementById(
                    "clearCartBtn"
                );


            if (clearButton) {

                clearButton.style.display =
                    cart.length > 0
                        ? "block"
                        : "none";

            }


            const content =
                document.getElementById(
                    "cartContent"
                );


            const totalElement =
                document.getElementById(
                    "cartTotal"
                );


            if (!content)
                return;


            if (
                cart.length === 0
            ) {

                content.innerHTML = `

                    <div
                        class="text-center py-12 text-slate-400 text-xs">

                        <div class="text-4xl mb-3">
                            🛒
                        </div>

                        <p>
                            Tu carrito está vacío
                        </p>

                        <p
                            class="text-[10px] mt-1">

                            Agrega productos para comenzar

                        </p>

                    </div>

                `;


                if (totalElement) {

                    totalElement.textContent =
                        "$0";

                }


                return;

            }


            content.innerHTML =
                cart
                    .map(
                        function (item) {

                            return `

                                <div
                                    class="flex items-center gap-2.5 bg-slate-50 p-2.5 rounded-xl border border-slate-100">


                                    <img
                                        src="${item.image}"
                                        class="w-12 h-12 object-contain rounded-lg bg-white shrink-0 p-1"
                                        onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}'">


                                    <div
                                        class="flex-1 min-w-0">


                                        <h5
                                            class="font-bold text-slate-900 text-[11px] truncate">

                                            ${item.name}

                                        </h5>


                                        <p
                                            class="font-extrabold text-[11px]">

                                            $${(
                                                item.price *
                                                item.quantity
                                            ).toLocaleString(
                                                "es-CO"
                                            )}

                                        </p>


                                        <div
                                            class="flex items-center gap-2 mt-1">


                                            <button
                                                type="button"
                                                onclick="updateQty(${item.id},-1)"
                                                class="w-6 h-6 bg-white border rounded text-[10px] font-bold">

                                                −

                                            </button>


                                            <span
                                                class="text-[11px] font-bold">

                                                ${item.quantity}

                                            </span>


                                            <button
                                                type="button"
                                                onclick="updateQty(${item.id},1)"
                                                class="w-6 h-6 bg-white border rounded text-[10px] font-bold">

                                                +

                                            </button>

                                        </div>

                                    </div>


                                    <button
                                        type="button"
                                        onclick="removeFromCart(${item.id})"
                                        class="text-slate-400 hover:text-red-600 text-xs font-bold p-1">

                                        ✕

                                    </button>

                                </div>

                            `;

                        }
                    )
                    .join("");


            const total =
                cart.reduce(
                    function (
                        sum,
                        item
                    ) {

                        return (
                            sum +
                            (
                                Number(
                                    item.price
                                ) *
                                Number(
                                    item.quantity
                                )
                            )
                        );

                    },
                    0
                );


            if (totalElement) {

                totalElement.textContent =
                    `$${total.toLocaleString(
                        "es-CO"
                    )}`;

            }

        }

           OPEN MOBILE CART
        ========================================================= */

        function openMobileCart() {

            setMobileNav(

            );

            openCart();

        /* =========================================================
           OPEN CART
        ========================================================= */

        function openCart() {

            const panel =
                document.getElementById(
                    "cartPanel"
                );


            const overlay =
                document.getElementById(
                    "cartOverlay"
                );


            if (
                !panel ||
                !overlay
            ) {

                return;

            }


            updateCartUI();


            closeSearchResults();


            panel.classList.remove(
                "is-closed"
            );

            panel.classList.add(
                "is-open"
            );


            panel.style.transform =
                "translateX(0)";


            overlay.classList.remove(
                "hidden"
            );


            overlay.style.display =
                "block";


            document.body.classList.add(
                "cart-is-open"
            );


            /* Evita que el navegador deje el carrito por debajo */

            panel.style.zIndex =
                "9996";

            overlay.style.zIndex =
                "9995";

        }


        /* =========================================================
           CLOSE CART
        ========================================================= */

        function closeCart() {

            const panel =
                document.getElementById(
                    "cartPanel"
                );


            const overlay =
                document.getElementById(
                    "cartOverlay"
                );


            if (panel) {

                panel.classList.remove(
                    "is-open"
                );

                panel.classList.add(
                    "is-closed"
                );

                panel.style.transform =
                    "translateX(100%)";

            }


            if (overlay) {

                overlay.classList.add(
                    "hidden"
                );

                overlay.style.display =
                    "none";

            }


            document.body.classList.remove(
                "cart-is-open"
            );

        }

        ) {

                );

                );


            const box =
                document.getElementById(

                );
