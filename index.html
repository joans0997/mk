<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Supermercado MerkoMAX NIMAR - Cimitarra</title>

  <link rel="icon" href="logo.png">

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: "#102A43",
            blueDark: "#071A2B",
            wine: "#7F1D3A",
            wineDark: "#5A1028",
            red: "#7F1D3A",
            darkBlue: "#102A43"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    body.cart-is-open,
    body.checkout-is-open {
      overflow: hidden;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .mobile-header {
      min-height: 64px;
    }

    .mobile-logo img {
      display: block;
      max-height: 42px;
    }

    .mobile-search {
      position: relative;
    }

    /* =========================================================
       SEARCH
    ========================================================= */

    #searchResults {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      background: white;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 20px 40px rgba(15, 23, 42, .15);
      overflow: hidden;
      z-index: 999;
      display: none;
    }

    #searchResults.show {
      display: block;
    }

    .search-result-item {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
      transition: background .15s ease;
    }

    .search-result-item:hover {
      background: #f8fafc;
    }

    .search-result-item img {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .mobile-hero-image {
      width: 120%;
      margin-left: -10%;
    }

    /* =========================================================
       PRODUCT GRID
    ========================================================= */

    #productsGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .product-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      overflow: hidden;
      transition: transform .2s ease, box-shadow .2s ease;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(15, 23, 42, .10);
    }

    .product-image-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f8fafc;
      overflow: hidden;
    }

    .product-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
    }

    .product-info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-name {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      color: #0f172a;
    }

    .product-category {
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .product-price {
      font-size: 18px;
      font-weight: 900;
      color: #7F1D3A;
      margin-top: auto;
      padding-top: 12px;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      gap: 8px;
    }

    .quantity-control button {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #cbd5e1;
      background: white;
      cursor: pointer;
    }

    .quantity-control button:hover {
      background: #f1f5f9;
    }

    .add-cart-btn {
      flex: 1;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: #102A43;
      color: white;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }

    .add-cart-btn:hover {
      background: #071A2B;
    }

    /* =========================================================
       CART
    ========================================================= */

    #cartOverlay {
      transition: opacity .25s ease;
    }

    .mobile-cart-wrapper {
      width: min(430px, 100vw);
      transform: translateX(100%);
      transition: transform .3s ease;
      pointer-events: none;
    }

    .mobile-cart-wrapper.is-open {
      transform: translateX(0);
      pointer-events: auto;
    }

    .mobile-cart-panel {
      width: 100%;
      height: 100%;
    }

    .cart-item {
      display: flex;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .cart-item-image {
      width: 62px;
      height: 62px;
      object-fit: contain;
      border-radius: 12px;
      background: #f8fafc;
      flex-shrink: 0;
    }

    /* =========================================================
       MOBILE BOTTOM NAV
    ========================================================= */

    #mobileBottomNav {
      display: none;
    }

    body.cart-is-open #mobileBottomNav {
      transform: translateY(100%);
    }

    /* =========================================================
       CHECKOUT
    ========================================================= */

    #checkoutModal {
      z-index: 9997;
    }

    #checkoutModal.hidden {
      display: none !important;
    }

    #checkoutModal:not(.hidden) {
      display: flex !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    .mobile-checkout {
      width: min(520px, 100%);
      max-height: 92vh;
      overflow-y: auto;
    }

    /* =========================================================
       TOAST
    ========================================================= */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: all .25s ease;
      z-index: 10000;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 768px) {

      .mobile-header {
        height: 68px;
        min-height: 68px;
        padding-left: 12px !important;
        padding-right: 12px !important;
        gap: 10px !important;
      }

      .mobile-logo {
        flex-shrink: 0;
      }

      .mobile-logo img {
        height: 42px !important;
        max-height: 42px;
        width: auto;
      }

      .mobile-search {
        flex: 1;
        min-width: 0;
        max-width: none;
      }

      .mobile-search input {
        height: 42px;
        font-size: 12px;
        padding-left: 14px !important;
        padding-right: 12px !important;
      }

      .mobile-search > div > span {
        display: none;
      }

      .mobile-hero {
        padding-top: 18px !important;
        padding-bottom: 18px !important;
      }

      .mobile-hero-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .mobile-hero-image {
        width: 100%;
        margin-left: 0;
      }

      .mobile-hero-image img {
        height: 150px !important;
      }

      #productsGrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .product-card {
        border-radius: 14px;
      }

      .product-info {
        padding: 10px;
      }

      .product-name {
        font-size: 12px;
      }

      .product-price {
        font-size: 16px;
      }

      .product-category {
        font-size: 9px;
      }

      .quantity-control {
        gap: 5px;
      }

      .quantity-control button {
        width: 30px;
        height: 30px;
      }

      .add-cart-btn {
        height: 32px;
        font-size: 10px;
      }

      /* Bottom nav */

      #mobileBottomNav {
        display: flex;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 66px;
        background: white;
        border-top: 1px solid #e2e8f0;
        box-shadow: 0 -8px 25px rgba(15, 23, 42, .10);
        z-index: 9990;
        transition: transform .25s ease;
        padding-bottom: env(safe-area-inset-bottom);
      }

      #mobileBottomNav button {
        flex: 1;
        border: 0;
        background: transparent;
        color: #64748b;
        font-size: 11px;
        font-weight: 800;
        cursor: pointer;
        position: relative;
      }

      #mobileBottomNav button.active {
        color: #7F1D3A;
      }

      .nav-cart-wrap {
        position: relative;
      }

      #mobileNavCartCounter {
        position: absolute;
        top: 7px;
        right: 25%;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: #7F1D3A;
        color: white;
        font-size: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Search results mobile */

      #searchResults {
        top: calc(100% + 5px);
        border-radius: 14px;
      }

      .search-result-item {
        padding: 10px;
      }

      .search-result-item img {
        width: 40px;
        height: 40px;
      }

      /* Checkout mobile */

      #checkoutModal {
        align-items: flex-end !important;
        padding: 0 !important;
      }

      .mobile-checkout {
        width: 100%;
        max-height: 94vh;
        border-radius: 22px 22px 0 0 !important;
      }

      #toast {
        bottom: 80px;
        width: calc(100% - 30px);
        text-align: center;
      }
    }

    @media (max-width: 380px) {

      .mobile-header {
        height: 62px;
        min-height: 62px;
      }

      .mobile-logo img {
        height: 36px !important;
      }

      .mobile-search input {
        height: 38px;
      }

      #productsGrid {
        gap: 8px;
      }

      .product-info {
        padding: 8px;
      }

      .product-name {
        font-size: 11px;
      }

      .product-price {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       HEADER
  ========================================================= -->

  <header
    id="top"
    class="sticky top-0 z-40 bg-white border-b border-slate-200"
  >
    <div
      class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3 mobile-header"
    >

      <div
        class="flex items-center gap-2 cursor-pointer mobile-logo"
        onclick="goHome()"
      >
        <img
          src="logo.png"
          alt="MerkoMAX"
          class="h-9 w-auto object-contain"
        >
      </div>

      <div class="flex-1 max-w-xl mobile-search">

        <div class="relative">

          <input
            type="text"
            id="searchInput"
            placeholder="¿Qué estás buscando?"
            autocomplete="off"
            class="w-full pl-4 pr-4 py-2 bg-slate-100 border border-transparent rounded-full text-xs font-medium focus:bg-white outline-none transition-all"
          >

          <div id="searchResults"></div>

        </div>

      </div>

      <button
        id="cartTrigger"
        type="button"
        style="display:none;"
      ></button>

    </div>
  </header>


  <!-- =========================================================
       HERO
  ========================================================= -->

  <section
    class="mobile-hero bg-gradient-to-r from-slate-900 via-slate-800 to-red-950 text-white py-6 px-4"
  >

    <div
      class="max-w-7xl mx-auto grid md:grid-cols-2 gap-4 items-center mobile-hero-grid"
    >

      <div class="space-y-2 text-center md:text-left">

        <span
          class="bg-white/10 text-white text-[10px] font-extrabold px-2.5 py-1 rounded-full uppercase tracking-wider border border-white/20"
        >
          ⚡ Cimitarra Express
        </span>

        <h1 class="text-xl md:text-3xl font-extrabold tracking-tight">
          Todo lo que necesitas, directo a tu casa.
        </h1>

        <p class="text-slate-300 text-xs">
          Calidad garantizada, precios bajos y entregas rápidas.
        </p>

      </div>

      <div
        class="mobile-hero-image rounded-2xl overflow-hidden shadow-lg border border-slate-700"
      >
        <img
          src="banner.jpeg"
          alt="MerkoMAX"
          class="w-full h-36 md:h-48 object-cover"
        >
      </div>

    </div>

  </section>


  <!-- =========================================================
       CATEGORIES
  ========================================================= -->

  <section class="bg-white border-b border-slate-200">

    <div class="max-w-7xl mx-auto px-4 py-4">

      <div
        class="flex gap-2 overflow-x-auto pb-1"
        style="scrollbar-width:none;"
      >

        <button
          type="button"
          onclick="filterCategory('todos')"
          class="category-btn shrink-0 bg-slate-900 text-white px-4 py-2 rounded-full text-xs font-bold"
          data-category="todos"
        >
          Todos
        </button>

        <button
          type="button"
          onclick="filterCategory('mas-vendidos')"
          class="category-btn shrink-0 bg-slate-100 text-slate-700 px-4 py-2 rounded-full text-xs font-bold"
          data-category="mas-vendidos"
        >
          Más vendidos
        </button>

        <button
          type="button"
          onclick="filterCategory('combos')"
          class="category-btn shrink-0 bg-slate-100 text-slate-700 px-4 py-2 rounded-full text-xs font-bold"
          data-category="combos"
        >
          Combos
        </button>

        <button
          type="button"
          onclick="filterCategory('despensa')"
          class="category-btn shrink-0 bg-slate-100 text-slate-700 px-4 py-2 rounded-full text-xs font-bold"
          data-category="despensa"
        >
          Despensa
        </button>

        <button
          type="button"
          onclick="filterCategory('frescos')"
          class="category-btn shrink-0 bg-slate-100 text-slate-700 px-4 py-2 rounded-full text-xs font-bold"
          data-category="frescos"
        >
          Frescos
        </button>

        <button
          type="button"
          onclick="filterCategory('lacteos')"
          class="category-btn shrink-0 bg-slate-100 text-slate-700 px-4 py-2 rounded-full text-xs font-bold"
          data-category="lacteos"
        >
          Lácteos
        </button>

        <button
          type="button"
          onclick="filterCategory('aseo')"
          class="category-btn shrink-0 bg-slate-100 text-slate-700 px-4 py-2 rounded-full text-xs font-bold"
          data-category="aseo"
        >
          Aseo
        </button>

      </div>

    </div>

  </section>


  <!-- =========================================================
       PRODUCTS
  ========================================================= -->

  <main class="max-w-7xl mx-auto px-4 py-6 pb-28">

    <div class="mb-5">

      <h2
        id="sectionTitle"
        class="text-xl md:text-2xl font-black text-slate-900"
      >
        Todos los productos
      </h2>

      <p
        id="sectionSubtitle"
        class="text-xs text-slate-500 mt-1"
      >
        Encuentra todo lo que necesitas.
      </p>

    </div>

    <div id="productsGrid"></div>

    <div
      id="loadingProducts"
      class="text-center py-12 text-slate-500 text-sm"
    >
      Cargando productos...
    </div>

  </main>


  <!-- =========================================================
       WHATSAPP FLOATING
  ========================================================= -->

  <a
    href="https://wa.me/573105500791?text=Hola%20MerkoMAX,%20tengo%20una%20consulta"
    target="_blank"
    rel="noopener noreferrer"
    class="fixed right-4 bottom-20 md:bottom-6 z-30 w-14 h-14 rounded-full bg-green-500 text-white flex items-center justify-center shadow-xl text-2xl"
    aria-label="WhatsApp"
  >
    💬
  </a>


  <!-- =========================================================
       MOBILE BOTTOM NAV
  ========================================================= -->

  <nav id="mobileBottomNav">

    <button
      id="mobileHomeBtn"
      class="active"
      type="button"
      onclick="goHome()"
    >
      ⌂ Inicio
    </button>

    <button
      id="mobileSearchBtn"
      type="button"
      onclick="openMobileSearch()"
    >
      ⌕ Buscar
    </button>

    <button
      id="mobileCartBtn"
      class="nav-cart-wrap"
      type="button"
      onclick="openMobileCart()"
    >
      🛒 Carrito

      <span
        id="mobileNavCartCounter"
        style="display:none;"
      >
        0
      </span>

    </button>

  </nav>


  <!-- =========================================================
       CART OVERLAY
  ========================================================= -->

  <div
    id="cartOverlay"
    class="fixed inset-0 bg-slate-900/60 z-50 hidden"
  ></div>


  <!-- =========================================================
       CART PANEL
  ========================================================= -->

  <div
    id="cartPanel"
    class="mobile-cart-wrapper fixed inset-y-0 right-0 z-50 is-closed"
  >

    <div class="mobile-cart-panel bg-white shadow-2xl flex flex-col">

      <div
        class="flex items-center justify-between p-4 border-b border-slate-200"
      >

        <div>
          <h2 class="font-black text-lg">
            Tu carrito
          </h2>

          <p
            id="cartItemsCount"
            class="text-xs text-slate-500"
          >
            0 productos
          </p>
        </div>

        <div class="flex items-center gap-2">

          <button
            id="clearCartBtn"
            type="button"
            class="text-xs font-bold text-red-600 px-2 py-2"
          >
            Vaciar
          </button>

          <button
            id="closeCart"
            type="button"
            class="w-9 h-9 rounded-full bg-slate-100 font-bold"
          >
            ✕
          </button>

        </div>

      </div>


      <div
        id="cartItems"
        class="flex-1 overflow-y-auto px-4"
      ></div>


      <div class="border-t border-slate-200 p-4">

        <div class="flex justify-between items-center mb-3">

          <span class="font-bold text-slate-600">
            Total
          </span>

          <span
            id="cartTotal"
            class="font-black text-xl text-wine"
          >
            $0
          </span>

        </div>

        <button
          id="continueShoppingBtn"
          type="button"
          class="w-full py-3 rounded-xl bg-slate-100 text-slate-800 font-bold text-sm mb-2"
        >
          ← Seguir comprando
        </button>

        <button
          id="openCheckoutModalBtn"
          type="button"
          onclick="openCheckoutModal(); return false;"
          class="w-full py-3 rounded-xl bg-wine text-white font-black text-sm"
        >
          💬 Continuar pedido por WhatsApp
        </button>

      </div>

    </div>

  </div>


  <!-- =========================================================
       CHECKOUT MODAL
  ========================================================= -->

  <div
    id="checkoutModal"
    class="fixed inset-0 bg-slate-900/70 z-50 hidden flex items-center justify-center p-3"
  >

    <div
      class="mobile-checkout bg-white rounded-2xl shadow-2xl"
    >

      <div
        class="flex items-center justify-between p-5 border-b border-slate-200"
      >

        <div>
          <h2 class="text-lg font-black">
            Finalizar pedido
          </h2>

          <p class="text-xs text-slate-500 mt-1">
            Completa tus datos para enviar el pedido.
          </p>
        </div>

        <button
          id="closeCheckoutModal"
          type="button"
          class="w-9 h-9 rounded-full bg-slate-100 font-bold"
        >
          ✕
        </button>

      </div>


      <form
        id="checkoutForm"
        class="p-5 space-y-4"
      >

        <div>

          <label
            for="custName"
            class="block text-xs font-bold text-slate-700 mb-1"
          >
            Nombre completo
          </label>

          <input
            id="custName"
            required
            type="text"
            placeholder="Tu nombre"
            class="w-full border border-slate-300 rounded-xl px-3 py-3 text-sm outline-none focus:border-wine"
          >

        </div>


        <div>

          <label
            for="custNeighborhood"
            class="block text-xs font-bold text-slate-700 mb-1"
          >
            Barrio
          </label>

          <input
            id="custNeighborhood"
            required
            type="text"
            placeholder="Ej: Centro"
            class="w-full border border-slate-300 rounded-xl px-3 py-3 text-sm outline-none focus:border-wine"
          >

        </div>


        <div>

          <label
            for="custAddress"
            class="block text-xs font-bold text-slate-700 mb-1"
          >
            Dirección
          </label>

          <input
            id="custAddress"
            required
            type="text"
            placeholder="Dirección de entrega"
            class="w-full border border-slate-300 rounded-xl px-3 py-3 text-sm outline-none focus:border-wine"
          >

        </div>


        <div>

          <label
            for="custPayment"
            class="block text-xs font-bold text-slate-700 mb-1"
          >
            Medio de pago
          </label>

          <select
            id="custPayment"
            onchange="toggleCashDetail()"
            class="w-full border border-slate-300 rounded-xl px-3 py-3 text-sm outline-none focus:border-wine"
          >

            <option value="Efectivo">
              Efectivo contra entrega
            </option>

            <option value="Nequi / Daviplata">
              Nequi / Daviplata
            </option>

            <option value="Datáfono">
              Datáfono
            </option>

          </select>

        </div>


        <div id="cashDetailBox">

          <label
            for="custCashAmount"
            class="block text-xs font-bold text-slate-700 mb-1"
          >
            ¿Con cuánto pagarás?
          </label>

          <input
            id="custCashAmount"
            type="number"
            min="0"
            placeholder="Ej: 100000"
            class="w-full border border-slate-300 rounded-xl px-3 py-3 text-sm outline-none focus:border-wine"
          >

        </div>


        <div>

          <label
            for="custNotes"
            class="block text-xs font-bold text-slate-700 mb-1"
          >
            Notas del pedido
          </label>

          <textarea
            id="custNotes"
            rows="3"
            placeholder="Alguna indicación para la entrega..."
            class="w-full border border-slate-300 rounded-xl px-3 py-3 text-sm outline-none focus:border-wine resize-none"
          ></textarea>

        </div>


        <button
          type="submit"
          class="w-full py-3.5 rounded-xl bg-wine text-white font-black text-sm"
        >
          💬 Enviar Pedido a WhatsApp
        </button>

      </form>

    </div>

  </div>


  <!-- =========================================================
       TOAST
  ========================================================= -->

  <div
    id="toast"
    class="bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl text-sm font-bold"
  ></div>


  <!-- =========================================================
       JAVASCRIPT
  ========================================================= -->

  <script>

    const SHEETDB_API =
      "https://sheetdb.io/api/v1/15hpacliqdaw2";

    const FALLBACK_IMAGE =
      "https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=400&q=80";

    const WHATSAPP_NUMBER =
      "573105500791";

    let products = [];
    let cart = [];

    let currentCategory = "todos";
    let searchQuery = "";

    const selectedQuantities = {};


    /* =========================================================
       NORMALIZE
    ========================================================= */

    function normalizeText(value) {

      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

    }


    /* =========================================================
       FETCH PRODUCTS
    ========================================================= */

    async function fetchProductsFromSheet() {

      const loading =
        document.getElementById("loadingProducts");

      try {

        const response =
          await fetch(SHEETDB_API);

        if (!response.ok) {
          throw new Error("No se pudieron cargar los productos");
        }

        const data =
          await response.json();

        products =
          Array.isArray(data)
            ? data
            : [];

        renderProducts();

      } catch (error) {

        console.error(error);

        if (loading) {

          loading.textContent =
            "No pudimos cargar los productos. Intenta nuevamente.";

        }

      } finally {

        if (loading) {
          loading.style.display = "none";
        }

      }

    }


    /* =========================================================
       PRODUCT VALUES
    ========================================================= */

    function getProductId(product) {

      return String(
        product.id ??
        product.ID ??
        product.codigo ??
        product.code ??
        product.name ??
        Math.random()
      );

    }


    function getProductName(product) {

      return String(
        product.name ??
        product.nombre ??
        "Producto"
      );

    }


    function getProductCategory(product) {

      return normalizeText(
        product.category ??
        product.categoria ??
        ""
      );

    }


    function getProductPrice(product) {

      const raw =
        product.price ??
        product.precio ??
        0;

      const number =
        Number(
          String(raw)
            .replace(/\$/g, "")
            .replace(/\./g, "")
            .replace(/,/g, ".")
        );

      return Number.isFinite(number)
        ? number
        : 0;

    }


    function getProductImage(product) {

      return (
        product.image ??
        product.imagen ??
        product.img ??
        FALLBACK_IMAGE
      );

    }


    /* =========================================================
       FORMAT PRICE
    ========================================================= */

    function formatCOP(value) {

      return new Intl.NumberFormat(
        "es-CO",
        {
          style: "currency",
          currency: "COP",
          maximumFractionDigits: 0
        }
      ).format(value || 0);

    }


    /* =========================================================
       RENDER PRODUCTS
    ========================================================= */

    function renderProducts() {

      const grid =
        document.getElementById("productsGrid");

      if (!grid) return;

      let filtered =
        products.filter(product => {

          const category =
            getProductCategory(product);

          const name =
            normalizeText(getProductName(product));

          const matchesCategory =
            currentCategory === "todos" ||
            category === normalizeText(currentCategory);

          const matchesSearch =
            !searchQuery ||
            name.includes(normalizeText(searchQuery));

          return matchesCategory && matchesSearch;

        });


      grid.innerHTML = "";


      if (filtered.length === 0) {

        grid.innerHTML = `
          <div class="col-span-full py-14 text-center">
            <div class="text-4xl mb-3">🛒</div>

            <h3 class="font-black text-slate-800">
              No encontramos productos
            </h3>

            <p class="text-sm text-slate-500 mt-1">
              Intenta con otra búsqueda o categoría.
            </p>
          </div>
        `;

        return;
      }


      filtered.forEach(product => {

        const id =
          getProductId(product);

        const name =
          getProductName(product);

        const category =
          getProductCategory(product);

        const price =
          getProductPrice(product);

        const image =
          getProductImage(product);

        const quantity =
          Number(selectedQuantities[id] || 1);


        const card =
          document.createElement("article");

        card.className =
          "product-card";


        card.innerHTML = `

          <div class="product-image-wrapper">

            <img
              src="${image}"
              alt="${name}"
              loading="lazy"
              onerror="this.src='${FALLBACK_IMAGE}'"
            >

          </div>


          <div class="product-info">

            <div class="product-name">
              ${name}
            </div>

            ${
              category
                ? `
                  <div class="product-category">
                    ${category}
                  </div>
                `
                : ""
            }


            <div class="product-price">
              ${formatCOP(price)}
            </div>


            <div class="quantity-control">

              <button
                type="button"
                onclick="changeSelectedQuantity('${escapeJs(id)}', -1)"
              >
                −
              </button>


              <span
                id="qty-${escapeHtml(id)}"
                class="font-black text-sm min-w-[20px] text-center"
              >
                ${quantity}
              </span>


              <button
                type="button"
                onclick="changeSelectedQuantity('${escapeJs(id)}', 1)"
              >
                +
              </button>


              <button
                type="button"
                class="add-cart-btn"
                onclick="addProductToCart('${escapeJs(id)}')"
              >
                Agregar
              </button>

            </div>

          </div>

        `;


        grid.appendChild(card);

      });

    }


    /* =========================================================
       ESCAPE
    ========================================================= */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function escapeJs(value) {

      return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
    }


    /* =========================================================
       SELECTED QUANTITY
    ========================================================= */

    function changeSelectedQuantity(id, change) {

      const current =
        Number(selectedQuantities[id] || 1);

      selectedQuantities[id] =
        Math.max(1, current + change);

      renderProducts();

    }


    /* =========================================================
       FIND PRODUCT
    ========================================================= */

    function findProduct(id) {

      return products.find(
        product =>
          String(getProductId(product)) === String(id)
      );

    }


    /* =========================================================
       ADD PRODUCT
    ========================================================= */

    function addProductToCart(id) {

      const product =
        findProduct(id);

      if (!product) return;

      const quantity =
        Number(selectedQuantities[id] || 1);

      const existing =
        cart.find(
          item =>
            String(item.id) === String(id)
        );


      if (existing) {

        existing.quantity += quantity;

      } else {

        cart.push({
          id: getProductId(product),
          name: getProductName(product),
          price: getProductPrice(product),
          image: getProductImage(product),
          quantity
        });

      }


      selectedQuantities[id] = 1;

      saveCart();
      updateCartUI();

      showToast(
        `${getProductName(product)} agregado al carrito`
      );

    }


    /* =========================================================
       CART STORAGE
    ========================================================= */

    function saveCart() {

      localStorage.setItem(
        "merkomaX_cart",
        JSON.stringify(cart)
      );

    }


    function loadCart() {

      try {

        const saved =
          localStorage.getItem("merkomaX_cart");

        cart =
          saved
            ? JSON.parse(saved)
            : [];

        if (!Array.isArray(cart)) {
          cart = [];
        }

      } catch {

        cart = [];

      }

      updateCartUI();

    }


    /* =========================================================
       CART UI
    ========================================================= */

    function updateCartUI() {

      const itemsContainer =
        document.getElementById("cartItems");

      const totalElement =
        document.getElementById("cartTotal");

      const countElement =
        document.getElementById("cartItemsCount");

      const mobileCounter =
        document.getElementById("mobileNavCartCounter");


      const totalItems =
        cart.reduce(
          (sum, item) =>
            sum + Number(item.quantity || 0),
          0
        );


      const total =
        cart.reduce(
          (sum, item) =>
            sum +
            Number(item.price || 0) *
            Number(item.quantity || 0),
          0
        );


      if (countElement) {

        countElement.textContent =
          `${totalItems} ${
            totalItems === 1
              ? "producto"
              : "productos"
          }`;

      }


      if (totalElement) {

        totalElement.textContent =
          formatCOP(total);

      }


      if (mobileCounter) {

        mobileCounter.textContent =
          totalItems;

        mobileCounter.style.display =
          totalItems > 0
            ? "flex"
            : "none";

      }


      if (!itemsContainer) return;


      if (cart.length === 0) {

        itemsContainer.innerHTML = `

          <div class="h-full flex flex-col items-center justify-center text-center">

            <div class="text-5xl mb-4">
              🛒
            </div>

            <h3 class="font-black text-slate-800">
              Tu carrito está vacío
            </h3>

            <p class="text-sm text-slate-500 mt-1">
              Agrega productos para comenzar.
            </p>

          </div>

        `;

        return;

      }


      itemsContainer.innerHTML =
        cart.map((item, index) => `

          <div class="cart-item">

            <img
              src="${item.image || FALLBACK_IMAGE}"
              alt="${escapeHtml(item.name)}"
              class="cart-item-image"
              onerror="this.src='${FALLBACK_IMAGE}'"
            >


            <div class="flex-1 min-w-0">

              <div class="font-bold text-sm leading-tight">
                ${escapeHtml(item.name)}
              </div>

              <div class="text-sm font-black text-wine mt-1">
                ${formatCOP(item.price)}
              </div>


              <div class="flex items-center gap-2 mt-2">

                <button
                  type="button"
                  onclick="updateCartQuantity(${index}, -1)"
                  class="w-7 h-7 rounded-lg bg-slate-100 font-black"
                >
                  −
                </button>

                <span class="font-black text-sm">
                  ${item.quantity}
                </span>

                <button
                  type="button"
                  onclick="updateCartQuantity(${index}, 1)"
                  class="w-7 h-7 rounded-lg bg-slate-100 font-black"
                >
                  +
                </button>

                <button
                  type="button"
                  onclick="removeCartItem(${index})"
                  class="ml-auto text-xs font-bold text-red-600"
                >
                  Eliminar
                </button>

              </div>

            </div>

          </div>

        `).join("");

    }


    /* =========================================================
       UPDATE CART QUANTITY
    ========================================================= */

    function updateCartQuantity(index, change) {

      if (!cart[index]) return;

      cart[index].quantity =
        Number(cart[index].quantity || 0) +
        change;


      if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

      }


      saveCart();
      updateCartUI();

    }


    /* =========================================================
       REMOVE ITEM
    ========================================================= */

    function removeCartItem(index) {

      if (!cart[index]) return;

      cart.splice(index, 1);

      saveCart();
      updateCartUI();

    }


    /* =========================================================
       CLEAR CART
    ========================================================= */

    function clearCart() {

      if (cart.length === 0) return;

      cart = [];

      saveCart();
      updateCartUI();

      showToast("Carrito vacío");

    }


    /* =========================================================
       CATEGORY
    ========================================================= */

    function filterCategory(category) {

      currentCategory =
        category || "todos";

      searchQuery = "";

      const searchInput =
        document.getElementById("searchInput");

      if (searchInput) {
        searchInput.value = "";
      }


      closeSearchResults();

      renderProducts();

      updateCategoryButtons();

    }


    function updateCategoryButtons() {

      document
        .querySelectorAll(".category-btn")
        .forEach(button => {

          const category =
            button.dataset.category;

          if (category === currentCategory) {

            button.classList.remove(
              "bg-slate-100",
              "text-slate-700"
            );

            button.classList.add(
              "bg-slate-900",
              "text-white"
            );

          } else {

            button.classList.remove(
              "bg-slate-900",
              "text-white"
            );

            button.classList.add(
              "bg-slate-100",
              "text-slate-700"
            );

          }

        });

    }


    /* =========================================================
       HOME
    ========================================================= */

    function goHome() {

      currentCategory = "todos";
      searchQuery = "";

      const input =
        document.getElementById("searchInput");

      if (input) {
        input.value = "";
      }

      closeSearchResults();

      renderProducts();
      updateCategoryButtons();

      setMobileNav("home");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================================================
       MOBILE SEARCH
    ========================================================= */

    function openMobileSearch() {

      setMobileNav("search");

      const input =
        document.getElementById("searchInput");

      if (!input) return;

      input.focus();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================================================
       SEARCH RESULTS
    ========================================================= */

    function updateSearchResults(value) {

      searchQuery = value.trim();

      const results =
        document.getElementById("searchResults");

      if (!results) return;


      if (!searchQuery) {

        results.innerHTML = "";
        results.classList.remove("show");

        renderProducts();

        return;

      }


      const normalized =
        normalizeText(searchQuery);


      const matches =
        products
          .filter(product =>
            normalizeText(
              getProductName(product)
            ).includes(normalized)
          )
          .slice(0, 8);


      if (matches.length === 0) {

        results.innerHTML = `

          <div class="p-4 text-sm text-slate-500 text-center">
            No encontramos productos.
          </div>

        `;

      } else {

        results.innerHTML =
          matches.map(product => {

            const id =
              getProductId(product);

            return `

              <div
                class="search-result-item"
                onclick="selectSearchProduct('${escapeJs(id)}')"
              >

                <img
                  src="${getProductImage(product)}"
                  alt="${escapeHtml(getProductName(product))}"
                  onerror="this.src='${FALLBACK_IMAGE}'"
                >

                <div class="min-w-0">

                  <div class="font-bold text-sm truncate">
                    ${escapeHtml(getProductName(product))}
                  </div>

                  <div class="text-xs font-black text-wine mt-1">
                    ${formatCOP(getProductPrice(product))}
                  </div>

                </div>

              </div>

            `;

          }).join("");

      }


      results.classList.add("show");

      renderProducts();

    }


    function selectSearchProduct(id) {

      const product =
        findProduct(id);

      if (!product) return;

      const input =
        document.getElementById("searchInput");

      if (input) {
        input.value =
          getProductName(product);
      }


      searchQuery =
        getProductName(product);

      currentCategory = "todos";

      closeSearchResults();

      renderProducts();

      setMobileNav("search");

      setTimeout(() => {

        const cards =
          document.querySelectorAll(".product-card");

        if (cards.length > 0) {

          cards[0].scrollIntoView({
            behavior: "smooth",
            block: "center"
          });

        }

      }, 100);

    }


    function closeSearchResults() {

      const results =
        document.getElementById("searchResults");

      if (!results) return;

      results.classList.remove("show");

    }


    /* =========================================================
       MOBILE NAV
    ========================================================= */

    function setMobileNav(active) {

      const buttons = {
        home:
          document.getElementById("mobileHomeBtn"),

        search:
          document.getElementById("mobileSearchBtn"),

        cart:
          document.getElementById("mobileCartBtn")
      };


      Object.values(buttons)
        .forEach(button => {

          if (button) {
            button.classList.remove("active");
          }

        });


      if (buttons[active]) {
        buttons[active].classList.add("active");
      }

    }


    /* =========================================================
       OPEN CART
    ========================================================= */

    function openMobileCart() {

      openCart();

    }


    function openCart() {

      const panel =
        document.getElementById("cartPanel");

      const overlay =
        document.getElementById("cartOverlay");

      if (!panel || !overlay) return;


      updateCartUI();


      panel.classList.add("is-open");

      overlay.classList.remove("hidden");

      document.body.classList.add("cart-is-open");

      setMobileNav("cart");

    }


    /* =========================================================
       CLOSE CART
    ========================================================= */

    function closeCart() {

      const panel =
        document.getElementById("cartPanel");

      const overlay =
        document.getElementById("cartOverlay");

      if (panel) {
        panel.classList.remove("is-open");
      }

      if (overlay) {
        overlay.classList.add("hidden");
      }

      document.body.classList.remove("cart-is-open");


      if (cart.length > 0) {

        setMobileNav("cart");

      } else {

        setMobileNav("home");

      }

    }


    /* =========================================================
       CONTINUE SHOPPING
    ========================================================= */

    function continueShopping() {

      closeCart();

      setMobileNav("home");

    }


    /* =========================================================
       CHECKOUT
    ========================================================= */

    function openCheckoutModal() {

      const checkoutModal =
        document.getElementById("checkoutModal");


      if (!checkoutModal) {

        console.error(
          "No se encontró checkoutModal"
        );

        return;

      }


      if (!cart || cart.length === 0) {

        showToast(
          "El carrito está vacío"
        );

        return;

      }


      closeCart();


      checkoutModal.classList.remove("hidden");


      checkoutModal.style.setProperty(
        "display",
        "flex",
        "important"
      );

      checkoutModal.style.setProperty(
        "visibility",
        "visible",
        "important"
      );

      checkoutModal.style.setProperty(
        "opacity",
        "1",
        "important"
      );

      checkoutModal.style.setProperty(
        "z-index",
        "9997",
        "important"
      );


      document.body.classList.add(
        "checkout-is-open"
      );


      toggleCashDetail();


      setTimeout(function() {

        const nameInput =
          document.getElementById("custName");

        if (nameInput) {
          nameInput.focus();
        }

      }, 150);

    }


    function closeCheckout() {

      const checkoutModal =
        document.getElementById("checkoutModal");

      if (!checkoutModal) return;


      checkoutModal.classList.add("hidden");


      checkoutModal.style.setProperty(
        "display",
        "none",
        "important"
      );

      checkoutModal.style.setProperty(
        "visibility",
        "hidden",
        "important"
      );

      checkoutModal.style.setProperty(
        "opacity",
        "0",
        "important"
      );


      document.body.classList.remove(
        "checkout-is-open"
      );


      if (cart.length > 0) {

        setMobileNav("cart");

      } else {

        setMobileNav("home");

      }

    }


    /* =========================================================
       CASH DETAIL
    ========================================================= */

    function toggleCashDetail() {

      const payment =
        document.getElementById("custPayment");

      const box =
        document.getElementById("cashDetailBox");

      const input =
        document.getElementById("custCashAmount");


      if (!payment || !box) return;


      if (payment.value === "Efectivo") {

        box.style.display = "block";

        if (input) {
          input.required = false;
        }

      } else {

        box.style.display = "none";

        if (input) {
          input.required = false;
          input.value = "";
        }

      }

    }


    /* =========================================================
       SUBMIT ORDER
    ========================================================= */

    function submitOrder(event) {

      event.preventDefault();


      if (!cart.length) {

        showToast(
          "El carrito está vacío"
        );

        return;

      }


      const name =
        document
          .getElementById("custName")
          .value
          .trim();


      const neighborhood =
        document
          .getElementById("custNeighborhood")
          .value
          .trim();


      const address =
        document
          .getElementById("custAddress")
          .value
          .trim();


      const payment =
        document
          .getElementById("custPayment")
          .value;


      const cashAmount =
        document
          .getElementById("custCashAmount")
          .value
          .trim();


      const notes =
        document
          .getElementById("custNotes")
          .value
          .trim();


      if (!name || !neighborhood || !address) {

        showToast(
          "Completa todos los datos de entrega"
        );

        return;

      }


      let message =
        `🛒 *NUEVO PEDIDO - MERKOMAX NIMAR*%0A%0A`;

      message =
        `🛒 *NUEVO PEDIDO - MERKOMAX NIMAR*\\n\\n`;


      message +=
        `👤 *Cliente:* ${name}\\n`;

      message +=
        `📍 *Barrio:* ${neighborhood}\\n`;

      message +=
        `🏠 *Dirección:* ${address}\\n`;

      message +=
        `💳 *Medio de pago:* ${payment}\\n`;


      if (
        payment === "Efectivo" &&
        cashAmount
      ) {

        message +=
          `💵 *Paga con:* ${formatCOP(
            Number(cashAmount)
          )}\\n`;

      }


      if (notes) {

        message +=
          `📝 *Notas:* ${notes}\\n`;

      }


      message +=
        `\\n🧺 *PRODUCTOS:*\\n`;


      let total = 0;


      cart.forEach(item => {

        const subtotal =
          Number(item.price || 0) *
          Number(item.quantity || 0);

        total += subtotal;


        message +=
          `• ${item.name} x${item.quantity} — ${formatCOP(subtotal)}\\n`;

      });


      message +=
        `\\n💰 *TOTAL: ${formatCOP(total)}*\\n`;

      message +=
        `\\nGracias por comprar en MerkoMAX NIMAR ❤️`;


      const whatsappUrl =
        `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;


      cart = [];

      saveCart();

      closeCheckout();


      document.body.classList.remove(
        "cart-is-open",
        "checkout-is-open"
      );


      updateCartUI();


      window.location.assign(
        whatsappUrl
      );

    }


    /* =========================================================
       TOAST
    ========================================================= */

    let toastTimeout;


    function showToast(message) {

      const toast =
        document.getElementById("toast");

      if (!toast) return;


      toast.textContent =
        message;

      toast.classList.add("show");


      clearTimeout(toastTimeout);


      toastTimeout =
        setTimeout(() => {

          toast.classList.remove("show");

        }, 2200);

    }


    /* =========================================================
       EVENTS
    ========================================================= */

    function setupEvents() {

      const searchInput =
        document.getElementById("searchInput");


      if (searchInput) {

        searchInput.addEventListener(
          "input",
          function(event) {

            updateSearchResults(
              event.target.value
            );

          }
        );


        searchInput.addEventListener(
          "focus",
          function() {

            if (this.value.trim()) {
              updateSearchResults(
                this.value
              );
            }

          }
        );

      }


      const overlay =
        document.getElementById("cartOverlay");


      if (overlay) {

        overlay.addEventListener(
          "click",
          closeCart
        );

      }


      const closeCartButton =
        document.getElementById("closeCart");


      if (closeCartButton) {

        closeCartButton.addEventListener(
          "click",
          closeCart
        );

      }


      const clearCartButton =
        document.getElementById("clearCartBtn");


      if (clearCartButton) {

        clearCartButton.addEventListener(
          "click",
          clearCart
        );

      }


      const continueShoppingButton =
        document.getElementById(
          "continueShoppingBtn"
        );


      if (continueShoppingButton) {

        continueShoppingButton.addEventListener(
          "click",
          continueShopping
        );

      }


      /*
        IMPORTANTE:
        No agregamos aquí otro listener al botón
        de checkout porque ya tiene onclick inline.
      */


      const closeCheckoutButton =
        document.getElementById(
          "closeCheckoutModal"
        );


      if (closeCheckoutButton) {

        closeCheckoutButton.addEventListener(
          "click",
          closeCheckout
        );

      }


      const checkoutForm =
        document.getElementById(
          "checkoutForm"
        );


      if (checkoutForm) {

        checkoutForm.addEventListener(
          "submit",
          submitOrder
        );

      }


      document.addEventListener(
        "keydown",
        function(event) {

          if (event.key !== "Escape") {
            return;
          }


          const checkoutModal =
            document.getElementById(
              "checkoutModal"
            );


          if (
            checkoutModal &&
            !checkoutModal.classList.contains("hidden")
          ) {

            closeCheckout();

            return;

          }


          const cartPanel =
            document.getElementById(
              "cartPanel"
            );


          if (
            cartPanel &&
            cartPanel.classList.contains("is-open")
          ) {

            closeCart();

          }

        }
      );


      document.addEventListener(
        "click",
        function(event) {

          const searchBox =
            document.querySelector(
              ".mobile-search"
            );


          const results =
            document.getElementById(
              "searchResults"
            );


          if (
            searchBox &&
            results &&
            !searchBox.contains(event.target)
          ) {

            closeSearchResults();

          }

        }
      );

    }


    /* =========================================================
       INIT
    ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        const overlay =
          document.getElementById(
            "cartOverlay"
          );

        if (overlay) {
          overlay.classList.add("hidden");
        }


        const checkoutModal =
          document.getElementById(
            "checkoutModal"
          );

        if (checkoutModal) {

          checkoutModal.classList.add(
            "hidden"
          );

          checkoutModal.style.display =
            "none";

        }


        const cartPanel =
          document.getElementById(
            "cartPanel"
          );

        if (cartPanel) {

          cartPanel.classList.remove(
            "is-open"
          );

        }


        document.body.classList.remove(
          "cart-is-open",
          "checkout-is-open"
        );


        loadCart();

        setupEvents();

        updateCategoryButtons();

        fetchProductsFromSheet();

      }
    );

  </script>

</body>
</html>
