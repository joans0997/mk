        /* =========================================================
           EVENTS
        ========================================================= */

        function setupEvents() {


            /* =====================================================
               SEARCH
            ===================================================== */

            const searchInput =
                document.getElementById(
                    "searchInput"
                );


            if (searchInput) {

                searchInput.addEventListener(
                    "input",
                    function () {

                        updateSearchResults();

                        setMobileNav(
                            "search"
                        );

                    }
                );


                searchInput.addEventListener(
                    "focus",
                    function () {

                        setMobileNav(
                            "search"
                        );


                        if (
                            searchInput.value.trim()
                        ) {

                            updateSearchResults();

                        }

                    }
                );


                searchInput.addEventListener(
                    "keydown",
                    function (event) {

                        if (
                            event.key ===
                            "Escape"
                        ) {

                            closeSearchResults();

                            searchInput.blur();

                        }

                    }
                );

            }


            /* =====================================================
               CLICK FUERA SEARCH
            ===================================================== */

            document.addEventListener(
                "click",
                function (event) {

                    const searchBox =
                        document.querySelector(
                            ".mobile-search"
                        );


                    if (
                        searchBox &&
                        !searchBox.contains(
                            event.target
                        )
                    ) {

                        closeSearchResults();

                    }

                }
            );


            /* =====================================================
               TOP CART
            ===================================================== */

            const cartTrigger =
                document.getElementById(
                    "cartTrigger"
                );


            if (cartTrigger) {

                cartTrigger.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();

                        event.stopPropagation();

                        setMobileNav(
                            "cart"
                        );

                        openCart();

                    }
                );

            }


            /* =====================================================
               CLOSE CART
            ===================================================== */

            const closeCartButton =
                document.getElementById(
                    "closeCart"
                );


            if (closeCartButton) {

                closeCartButton.addEventListener(
                    "click",
                    closeCart
                );

            }


            /* =====================================================
               OVERLAY
            ===================================================== */

            const overlay =
                document.getElementById(
                    "cartOverlay"
                );


            if (overlay) {

                overlay.addEventListener(
                    "click",
                    closeCart
                );

            }


            /* =====================================================
               CONTINUE SHOPPING
            ===================================================== */

            const continueButton =
                document.getElementById(
                    "continueShoppingBtn"
                );


            if (continueButton) {

                continueButton.addEventListener(
                    "click",
                    continueShopping
                );

            }


            /* =====================================================
               CHECKOUT
            ===================================================== */

            const checkoutButton =
                document.getElementById(
                    "openCheckoutModalBtn"
                );


            const checkoutModal =
                document.getElementById(
                    "checkoutModal"
                );


            if (
                checkoutButton &&
                checkoutModal
            ) {

                checkoutButton.addEventListener(
                    "click",
                    function () {

                        if (
                            cart.length === 0
                        ) {

                            showToast(
                                "El carrito está vacío"
                            );

                            return;

                        }


                        closeCart();


                        checkoutModal
                            .classList
                            .remove(
                                "hidden"
                            );


                        document.body.classList.add(
                            "cart-is-open"
                        );


                        toggleCashDetail();

                    }
                );

            }


            /* =====================================================
               CLOSE CHECKOUT
            ===================================================== */

            const closeCheckout =
                document.getElementById(
                    "closeCheckoutModal"
                );


            if (
                closeCheckout &&
                checkoutModal
            ) {

                closeCheckout.addEventListener(
                    "click",
                    function () {

                        checkoutModal
                            .classList
                            .add(
                                "hidden"
                            );


                        document.body.classList.remove(
                            "cart-is-open"
                        );

                    }
                );

            }


            /* =====================================================
               CLICK FUERA CHECKOUT
            ===================================================== */

            if (checkoutModal) {

                checkoutModal.addEventListener(
                    "click",
                    function (event) {

                        if (
                            event.target ===
                            checkoutModal
                        ) {

                            checkoutModal
                                .classList
                                .add(
                                    "hidden"
                                );


                            document.body.classList.remove(
                                "cart-is-open"
                            );

                        }

                    }
                );

            }


            /* =====================================================
               FORM
            ===================================================== */

            const checkoutForm =
                document.getElementById(
                    "checkoutForm"
                );


            if (checkoutForm) {

                checkoutForm.addEventListener(
                    "submit",
                    submitOrder
                );

            }


            /* =====================================================
               ESC
            ===================================================== */

            document.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key ===
                        "Escape"
                    ) {

                        closeSearchResults();

                        closeCart();


                        if (
                            checkoutModal
                        ) {

                            checkoutModal
                                .classList
                                .add(
                                    "hidden"
                                );

                        }

                    }

                }
            );

        }


        /* =========================================================
           SUBMIT ORDER
        ========================================================= */

        function submitOrder(
            event
        ) {

            event.preventDefault();


            const name =
                document
                    .getElementById(
                        "custName"
                    )
                    .value
                    .trim();


            const neighborhood =
                document
                    .getElementById(
                        "custNeighborhood"
                    )
                    .value
                    .trim();


            const address =
                document
                    .getElementById(
                        "custAddress"
                    )
                    .value
                    .trim();


            const payment =
                document
                    .getElementById(
                        "custPayment"
                    )
                    .value;


            const cash =
                document
                    .getElementById(
                        "custCashAmount"
                    )
                    .value
                    .trim();


            const notes =
                document
                    .getElementById(
                        "custNotes"
                    )
                    .value
                    .trim();


            let message =
                "🛒 *PEDIDO - MERKOMAX NIMAR*\n\n";


            message +=
                `👤 *Cliente:* ${name}\n`;

            message +=
                `📍 *Barrio:* ${neighborhood}\n`;

            message +=
                `🏠 *Dirección:* ${address}\n`;

            message +=
                `💳 *Pago:* ${payment}\n`;


            if (
                payment ===
                "Efectivo" &&
                cash
            ) {

                message +=
                    `💵 *Cambio para:* ${cash}\n`;

            }


            if (notes) {

                message +=
                    `📝 *Notas:* ${notes}\n`;

            }


            message +=
                "\n📦 *PRODUCTOS:*\n";


            cart.forEach(
                function (
                    item,
                    index
                ) {

                    message +=
                        `${index + 1}. ${item.name} x${item.quantity} - $${(
                            item.price *
                            item.quantity
                        ).toLocaleString(
                            "es-CO"
                        )}\n`;

                }
            );


            const total =
                cart.reduce(
                    function (
                        sum,
                        item
                    ) {

                        return (
                            sum +
                            (
                                item.price *
                                item.quantity
                            )
                        );

                    },
                    0
                );


            message +=
                `\n💰 *TOTAL: $${total.toLocaleString(
                    "es-CO"
                )}*`;


            window.open(
                `https://wa.me/573105500791?text=${encodeURIComponent(
                    message
                )}`,
                "_blank"
            );


            cart = [];


            saveCart();


            document
                .getElementById(
                    "checkoutModal"
                )
                .classList
                .add(
                    "hidden"
                );


            document.body.classList.remove(
                "cart-is-open"
            );

        }

    </script>

</body>

</html>
