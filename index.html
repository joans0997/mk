<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

    const SHEETDB_API =
        "https://sheetdb.io/api/v1/15hpacliqdaw2";

    let products = [];
    let cart = [];
    let currentCategory = 'todos';
    let searchQuery = '';


    /* =========================================================
       INIT
    ========================================================= */

    document.addEventListener('DOMContentLoaded', () => {

        loadCartFromLocalStorage();

        fetchProductsFromSheet();

        setupEvents();

    });


    /* =========================================================
       LOAD PRODUCTS
    ========================================================= */

    async function fetchProductsFromSheet() {

        try {

            const res =
                await fetch(SHEETDB_API);

            const data =
                await res.json();

            products = data.map(item => ({

                id:
                    Number(item.id) ||
                    Math.random(),

                name:
                    item.name ||
                    'Producto',

                category:
                    item.category
                        ? item.category.trim().toLowerCase()
                        : 'despensa',

                price:
                    parseFloat(
                        String(item.price || '0')
                            .replace(/\./g, '')
                            .replace(/[^0-9]/g, '')
                    ) || 0,

                oldPrice:
                    item.oldPrice
                        ? parseFloat(
                            String(item.oldPrice)
                                .replace(/\./g, '')
                                .replace(/[^0-9]/g, '')
                        )
                        : null,

                isBestSeller:
                    String(item.isBestSeller)
                        .toUpperCase() === 'TRUE',

                image:
                    item.image ||
                    'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=400&q=80'

            }));

            renderProducts();

        } catch (e) {

            document.getElementById('productsGrid').innerHTML = `

                <p class="text-xs text-red-500 text-center col-span-2 py-8">

                    Error cargando productos.

                </p>

            `;

        }

    }


    /* =========================================================
       RENDER PRODUCTS
    ========================================================= */

    function renderProducts() {

        const grid =
            document.getElementById('productsGrid');

        const filtered =
            products.filter(p => {

                const matchCat =
                    currentCategory === 'todos'
                        ? true
                        : currentCategory === 'mas-vendidos'
                            ? p.isBestSeller
                            : p.category === currentCategory;

                const matchSearch =
                    p.name
                        .toLowerCase()
                        .includes(
                            searchQuery.toLowerCase()
                        );

                return matchCat && matchSearch;

            });


        if (filtered.length === 0) {

            grid.innerHTML = `

                <p class="text-xs text-slate-500 text-center col-span-2 py-8">

                    No se encontraron productos.

                </p>

            `;

            return;

        }


        grid.innerHTML =
            filtered.map(p => `

                <div
                    class="product-card bg-white rounded-2xl p-3 border border-slate-100 shadow-sm flex flex-col justify-between relative group hover:shadow-md transition-all">

                    <div
                        class="absolute top-2.5 right-2.5 z-10 bg-emerald-600 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold shadow-xs">

                        ✓

                    </div>


                    ${
                        p.category === 'combos'
                            ? `
                                <span
                                    class="absolute top-2.5 left-2.5 z-10 bg-red-600 text-white text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase">

                                    COMBO

                                </span>
                            `
                            : ''
                    }


                    ${
                        p.isBestSeller &&
                        p.category !== 'combos'
                            ? `
                                <span
                                    class="absolute top-2.5 left-2.5 z-10 bg-amber-500 text-white text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase">

                                    TOP

                                </span>
                            `
                            : ''
                    }


                    <div>

                        <div
                            class="product-image h-32 w-full rounded-xl overflow-hidden bg-slate-50 mb-2 flex items-center justify-center">

                            <img
                                src="${p.image}"
                                alt="${p.name}"
                                loading="lazy"
                                class="h-full w-full object-contain group-hover:scale-105 transition-transform duration-300">

                        </div>


                        <h3
                            class="product-name font-bold text-slate-900 text-xs line-clamp-2 mt-1 h-8 leading-tight">

                            ${p.name}

                        </h3>

                    </div>


                    <div
                        class="pt-2 border-t border-slate-50 mt-2 space-y-2">

                        <div
                            class="flex items-baseline gap-1 flex-wrap">

                            <span
                                class="product-price text-xs font-extrabold text-slate-900">

                                $${p.price.toLocaleString('es-CO')}

                            </span>


                            ${
                                p.oldPrice
                                    ? `
                                        <span
                                            class="product-old-price text-[9px] text-slate-400 line-through">

                                            $${p.oldPrice.toLocaleString('es-CO')}

                                        </span>
                                    `
                                    : ''
                            }

                        </div>


                        <button
                            onclick="addToCart(${p.id})"
                            class="product-add w-full bg-red-50 hover:bg-red-600 text-red-600 hover:text-white font-bold py-2 rounded-xl text-[11px] transition-colors flex items-center justify-center gap-1">

                            <span>
                                + Agregar
                            </span>

                        </button>

                    </div>

                </div>

            `).join('');

    }


    /* =========================================================
       CATEGORY
    ========================================================= */

    function filterCategory(cat) {

        currentCategory = cat;

        document.getElementById('sectionTitle').textContent =
            cat === 'todos'
                ? "Nuestros Productos"
                : cat === 'mas-vendidos'
                    ? "Top Ventas"
                    : cat.charAt(0).toUpperCase() + cat.slice(1);

        document.getElementById('sectionSubtitle').textContent =
            cat === 'todos'
                ? "Catálogo en tiempo real"
                : `Mostrando categoría: ${cat}`;

        renderProducts();

    }


    /* =========================================================
       CART STORAGE
    ========================================================= */

    function loadCartFromLocalStorage() {

        const saved =
            localStorage.getItem('merkomax_cart');

        if (saved) {

            try {

                cart = JSON.parse(saved);

            } catch (e) {

                cart = [];

            }

        }

        updateCartUI();

    }


    function saveCart() {

        localStorage.setItem(
            'merkomax_cart',
            JSON.stringify(cart)
        );

        updateCartUI();

    }


    /* =========================================================
       CART
    ========================================================= */

    function addToCart(id) {

        const p =
            products.find(x => x.id === id);

        if (!p) return;

        const item =
            cart.find(x => x.id === id);

        if (item) {

            item.quantity++;

        } else {

            cart.push({
                ...p,
                quantity: 1
            });

        }

        saveCart();

        showToast(`¡Agregado: ${p.name}!`);

    }


    function updateQty(id, delta) {

        const item =
            cart.find(x => x.id === id);

        if (!item) return;

        item.quantity += delta;

        if (item.quantity <= 0) {

            cart =
                cart.filter(x => x.id !== id);

        }

        saveCart();

    }


    function removeFromCart(id) {

        cart =
            cart.filter(x => x.id !== id);

        saveCart();

    }


    function clearCart() {

        if (confirm("¿Vaciar carrito?")) {

            cart = [];

            saveCart();

        }

    }


    /* =========================================================
       MOBILE NAV
    ========================================================= */

    function setMobileNav(active) {

        document
            .querySelectorAll('#mobileBottomNav button')
            .forEach(btn =>
                btn.classList.remove('active')
            );


        let target = null;


        if (active === 'home') {

            target =
                document.getElementById('mobileHomeBtn');

        } else if (active === 'search') {

            target =
                document.querySelector(
                    '#mobileBottomNav button:nth-child(2)'
                );

        } else if (active === 'cart') {

            target =
                document.querySelector(
                    '#mobileBottomNav button:nth-child(3)'
                );

        }


        if (target) {

            target.classList.add('active');

        }

    }


    /* =========================================================
       CART UI
    ========================================================= */

    function updateCartUI() {

        const cartCount =
            cart.reduce(
                (a, b) => a + b.quantity,
                0
            );


        document.getElementById(
            'cartCounter'
        ).textContent = cartCount;


        const mobileCounter =
            document.getElementById(
                'mobileNavCartCounter'
            );


        if (mobileCounter) {

            mobileCounter.textContent =
                cartCount;

            mobileCounter.style.display =
                cartCount > 0
                    ? 'flex'
                    : 'none';

        }


        document.getElementById(
            'clearCartBtn'
        ).style.display =
            cart.length > 0
                ? 'block'
                : 'none';


        const content =
            document.getElementById(
                'cartContent'
            );


        if (cart.length === 0) {

            content.innerHTML = `

                <div class="text-center py-12 text-slate-400 text-xs">

                    Tu carrito está vacío

                </div>

            `;

            document.getElementById(
                'cartTotal'
            ).textContent = '$0';

            return;

        }


        content.innerHTML =
            cart.map(i => `

                <div
                    class="flex items-center gap-2.5 bg-slate-50 p-2.5 rounded-xl border border-slate-100">

                    <img
                        src="${i.image}"
                        loading="lazy"
                        class="w-10 h-10 object-contain rounded-lg bg-white shrink-0 p-1">


                    <div class="flex-1 min-w-0">

                        <h5
                            class="font-bold text-slate-900 text-[11px] truncate">

                            ${i.name}

                        </h5>


                        <p
                            class="text-red-600 font-extrabold text-[11px]">

                            $${(
                                i.price *
                                i.quantity
                            ).toLocaleString('es-CO')}

                        </p>


                        <div
                            class="flex items-center gap-2 mt-1">

                            <button
                                onclick="updateQty(${i.id}, -1)"
                                class="w-5 h-5 bg-white border rounded text-[10px] font-bold">

                                -

                            </button>


                            <span
                                class="text-[11px] font-bold">

                                ${i.quantity}

                            </span>


                            <button
                                onclick="updateQty(${i.id}, 1)"
                                class="w-5 h-5 bg-white border rounded text-[10px] font-bold">

                                +

                            </button>

                        </div>

                    </div>


                    <button
                        onclick="removeFromCart(${i.id})"
                        class="text-slate-400 hover:text-red-600 text-xs font-bold p-1">

                        ✕

                    </button>

                </div>

            `).join('');


        const total =
            cart.reduce(
                (a, b) =>
                    a +
                    (b.price * b.quantity),
                0
            );


        document.getElementById(
            'cartTotal'
        ).textContent =
            `$${total.toLocaleString('es-CO')}`;

    }


    /* =========================================================
       TOAST
    ========================================================= */

    function showToast(msg) {

        const container =
            document.getElementById(
                'toastContainer'
            );


        const t =
            document.createElement('div');


        t.className =
            "bg-slate-900 text-white text-[11px] font-semibold px-3 py-2 rounded-xl shadow-lg";


        t.textContent = msg;


        container.appendChild(t);


        setTimeout(
            () => t.remove(),
            2500
        );

    }


    /* =========================================================
       PAYMENT
    ========================================================= */

    function toggleCashDetail() {

        const pay =
            document.getElementById(
                'custPayment'
            ).value;


        document.getElementById(
            'cashDetailBox'
        ).style.display =
            pay === 'Efectivo'
                ? 'block'
                : 'none';

    }


    /* =========================================================
       HOME
    ========================================================= */

    function resetToHome() {

        filterCategory('todos');

        document.getElementById(
            'searchInput'
        ).value = '';

        searchQuery = '';

    }


    /* =========================================================
       EVENTS
    ========================================================= */

    function setupEvents() {

        const search =
            document.getElementById(
                'searchInput'
            );


        search.addEventListener(
            'input',
            (e) => {

                searchQuery =
                    e.target.value;

                renderProducts();

                setMobileNav('search');

            }
        );


        const cartTrigger =
            document.getElementById(
                'cartTrigger'
            );

        const cartPanel =
            document.getElementById(
                'cartPanel'
            );

        const cartOverlay =
            document.getElementById(
                'cartOverlay'
            );

        const closeCart =
            document.getElementById(
                'closeCart'
            );


        const toggleCart = (open) => {

            cartPanel.classList.toggle(
                'translate-x-full',
                !open
            );

            cartOverlay.classList.toggle(
                'hidden',
                !open
            );

            document.body.style.overflow =
                open ? 'hidden' : '';

        };


        cartTrigger.addEventListener(
            'click',
            () => {

                toggleCart(true);

                setMobileNav('cart');

            }
        );


        closeCart.addEventListener(
            'click',
            () => toggleCart(false)
        );


        cartOverlay.addEventListener(
            'click',
            () => toggleCart(false)
        );


        /* CHECKOUT */

        const checkoutModal =
            document.getElementById(
                'checkoutModal'
            );


        document
            .getElementById(
                'openCheckoutModalBtn'
            )
            .addEventListener(
                'click',
                () => {

                    if (cart.length === 0) {

                        showToast(
                            'El carrito está vacío'
                        );

                        return;

                    }

                    toggleCart(false);

                    checkoutModal.classList.remove(
                        'hidden'
                    );

                    document.body.style.overflow =
                        'hidden';

                }
            );


        document
            .getElementById(
                'closeCheckoutModal'
            )
            .addEventListener(
                'click',
                () => {

                    checkoutModal.classList.add(
                        'hidden'
                    );

                    document.body.style.overflow =
                        '';

                }
            );


        /* FORMULARIO */

        document
            .getElementById(
                'checkoutForm'
            )
            .addEventListener(
                'submit',
                (e) => {

                    e.preventDefault();


                    const name =
                        document
                            .getElementById(
                                'custName'
                            )
                            .value
                            .trim();


                    const neighborhood =
                        document
                            .getElementById(
                                'custNeighborhood'
                            )
                            .value
                            .trim();


                    const address =
                        document
                            .getElementById(
                                'custAddress'
                            )
                            .value
                            .trim();


                    const payment =
                        document
                            .getElementById(
                                'custPayment'
                            )
                            .value;


                    const cash =
                        document
                            .getElementById(
                                'custCashAmount'
                            )
                            .value
                            .trim();


                    const notes =
                        document
                            .getElementById(
                                'custNotes'
                            )
                            .value
                            .trim();


                    let msg =
                        `🛒 *PEDIDO - MERKOMAX NIMAR*\n\n`;


                    msg +=
                        `👤 *Cliente:* ${name}\n` +
                        `📍 *Barrio:* ${neighborhood}\n` +
                        `🏠 *Dirección:* ${address}\n` +
                        `💳 *Pago:* ${payment}\n`;


                    if (
                        payment === 'Efectivo' &&
                        cash
                    ) {

                        msg +=
                            `💵 *Cambio para:* ${cash}\n`;

                    }


                    if (notes) {

                        msg +=
                            `📝 *Notas:* ${notes}\n`;

                    }


                    msg +=
                        `\n📦 *PRODUCTOS:*\n`;


                    cart.forEach(
                        (i, idx) => {

                            msg +=
                                `${idx + 1}. ${i.name} x${i.quantity} - $${(
                                    i.price *
                                    i.quantity
                                ).toLocaleString('es-CO')}\n`;

                        }
                    );


                    const total =
                        cart.reduce(
                            (a, b) =>
                                a +
                                (b.price *
                                    b.quantity),
                            0
                        );


                    msg +=
                        `\n💰 *TOTAL: $${total.toLocaleString('es-CO')}*`;


                    window.open(
                        `https://wa.me/573105500791?text=${encodeURIComponent(msg)}`,
                        '_blank'
                    );


                    cart = [];

                    saveCart();


                    checkoutModal.classList.add(
                        'hidden'
                    );

                    document.body.style.overflow =
                        '';

                }
            );

    }

</script>
